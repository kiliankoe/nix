name: Validate Nix Flake

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Fork PRs can't see the deploy key for the private flake input.
    # Skip them instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      # Read-only deploy key so nix can fetch the private flake input
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.NIX_PRIVATE_DEPLOY_KEY }}

      - uses: DeterminateSystems/nix-installer-action@v19

      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          # We're not on FlakeHub; left opportunistic it errors on every run
          # before falling back to the GitHub Actions cache anyway.
          use-flakehub: "disabled"

      - name: Check flake
        run: nix flake check --no-build

      - name: Lint with statix
        run: nix run nixpkgs#statix -- check .

      - name: Check formatting
        # nixfmt takes files, not directories, and bash only recurses on `**`
        # with globstar enabled, so feed it the tracked file list explicitly.
        run: git ls-files '*.nix' | xargs nix run nixpkgs#nixfmt -- --check

      - name: Check for dead code
        run: nix run nixpkgs#deadnix -- --fail .
